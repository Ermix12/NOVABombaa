name: Build NOVAbomba Mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Fabric and Forge
        run: |
          if [ -d "fabric" ]; then
            cd fabric
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew build
            cd ..
          fi
          if [ -d "forge" ]; then
            cd forge
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew build
            cd ..
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NOVAbomba-JARs
          path: |
            **/build/libs/*.jar
