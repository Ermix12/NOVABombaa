name: Build NOVAbomba Mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Gradle 8.5 Binary and Build Fabric & Forge
        run: |
          # Pobieramy bezpośrednio dystrybucję Gradle 8.5, żeby uniknąć nowszych wersji
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH

          if [ -d "fabric" ]; then
            cd fabric
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x gradlew
            ./gradlew build
            cd ..
          fi

          if [ -d "forge" ]; then
            cd forge
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x gradlew
            ./gradlew build
            cd ..
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NOVAbomba-JARs
          path: |
            **/build/libs/*.jar
